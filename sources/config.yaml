# gftools-builder config. The masters and the designspace are generated from glyphs.txt by
# sources/build.py, which also runs fontmake itself; this file lets `gftools builder` compile
# the same variable font. Static weights are not shipped: the variable font has them all as
# named instances, and Google Fonts makes its own statics from it.
sources:
  - RunionNeo.designspace
familyName: Runion Neo
buildVariable: true
buildStatic: false
buildOTF: false
buildWebfont: true
autohintTTF: false
