name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: make venv
      - name: Build fonts from sources/glyphs.txt
        run: make build
      - name: Fontbakery, Google Fonts profile
        run: make test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runion-neo
          path: |
            fonts
            out/fontbakery-*.md
